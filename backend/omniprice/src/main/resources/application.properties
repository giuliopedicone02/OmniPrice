# Server
server.port=8080
server.servlet.context-path=/api

# Database (H2 persistente su file locale)
spring.datasource.url=jdbc:h2:file:./data/omniprice;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
omniprice.jwt.secret=dGhpcylzLWEtc3VwZXItc2VjcmV0LWtleS1mb3Itb21uaXByaWNlLWp3dC10b2tlbnMtMjAyNg==
omniprice.jwt.expiration=86400000

# RabbitMQ (abilita con: omniprice.rabbitmq.enabled=true quando Docker e' avviato)
omniprice.rabbitmq.enabled=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=2000

# Resilience4J store services
omniprice.store.timeout-seconds=3
omniprice.store.retry-attempts=2
omniprice.store.cb-failure-rate=50

# Rate-Limiting login (Pattern Authenticator §5.3.2)
# Max 5 tentativi di login per IP: base 30s, con raddoppio esponenziale fino a max 5 minuti (300s)
omniprice.ratelimit.login.limit-for-period=5
omniprice.ratelimit.login.refresh-period-seconds=30
omniprice.ratelimit.login.max-penalty-seconds=300

# Scheduler
omniprice.scheduler.price-check-cron=0 */5 * * * *
omniprice.scheduler.batch-write-cron=0 */2 * * * *

# Idempotent Receiver: ritenzione del registro messaggi processati (ISD §5)
# I messaggi processati vengono cancellati dopo retention-minutes; purge ogni ora.
omniprice.idempotency.retention-minutes=60
omniprice.idempotency.purge-cron=0 0 * * * *

# Logging
logging.level.com.unict.dmi.omniprice=INFO
